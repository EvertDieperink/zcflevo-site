name: Hugo GitHub Pages Deploy

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - uses: actions/checkout@v3

      # Install Hugo
      - uses: peaceiris/actions-hugo@v4
        with:
          hugo-version: '0.116.0'

      # Build Hugo site
      - name: Build
        run: hugo --minify

      # Deploy to gh-pages
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
