baseURL = '/'  # GitHub Actions injects the real URL at deploy time (see .github/workflows/hugo.yml)
languageCode = 'nl'
title = 'Zweefvliegclub Flevo'
theme = 'zcflevo'

[markup.goldmark.renderer]
  unsafe = true  # Needed to render HTML in markdown (contact page)

[params]
  description = "ZC Flevo is een actieve zweefvliegclub vanuit Vliegveld Terlet bij Arnhem."
  email = "secretaris@zcflevo.nl"
  veldtelefoonnummer = "06-17722964"
  address = "Vliegveld Terlet, Apeldoornseweg 203, 6816 SM Arnhem"
  facebook = "https://www.facebook.com/zcflevo/"
  instagram = "https://www.instagram.com/zweefvliegclubflevo/"
  youtube = "https://www.youtube.com/channel/UCjxBLZcew6u7KOLpH2wSq0A"
  tiktok = "https://www.tiktok.com/@zc.flevo"
  mapboxToken = ""  # Set this via environment variable in GitHub Actions
  tagline = "Een actieve en gezellige zweefvliegclub, opgericht in 1972. Wij vliegen vanuit Vliegveld Terlet bij Arnhem."
  address_line1 = "Vliegveld Terlet"
  address_line2 = "Apeldoornseweg 203"
  address_line3 = "6816 SM Arnhem"

# ── Menu ──────────────────────────────────────────────────────────────────────
# Het menu wordt automatisch opgebouwd vanuit de front matter van elke pagina.
# Om een pagina in de navigatie te zetten, voeg je dit toe aan de front matter:
#
#   menu:
#     main:
#       weight: 10          # bepaalt de volgorde (laag = eerst)
#
# Voor een dropdown-pagina (kind van een sectie):
#   menu:
#     main:
#       parent: "onze-club"        # of "de-mogelijkheden"
#       weight: 21
#
# Voor een nieuwe sectie met dropdown (bovenste niveau):
#   menu:
#     main:
#       identifier: "mijn-sectie"  # unieke naam voor dit dropdown-menu
#       weight: 6
