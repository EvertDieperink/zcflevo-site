baseURL = '/'  # GitHub Actions injects the real URL at deploy time (see .github/workflows/hugo.yml)
languageCode = 'nl'
title = 'Zweefvliegclub Flevo'
theme = 'zcflevo'

[markup.goldmark.renderer]
  unsafe = true  # Needed to render HTML in markdown (contact page)

[params]
  description = "ZC Flevo is een actieve zweefvliegclub vanuit Vliegveld Terlet bij Arnhem."
  email = "secretaris@zcflevo.nl"
  phone = "06-17722964"
  address = "Vliegveld Terlet, Apeldoornseweg 203, 6816 SM Arnhem"
  facebook = "https://www.facebook.com/zcflevo/"
  instagram = "https://www.instagram.com/zweefvliegclubflevo/"
  youtube = "https://www.youtube.com/channel/UCjxBLZcew6u7KOLpH2wSq0A"
  tiktok = "https://www.tiktok.com/@zc.flevo"
  mapboxToken = ""  # Set this via environment variable in GitHub Actions

