{{- with .Params.faqs -}}
{{- $email := $.Site.Params.email -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- range $i, $faq := . -}}
    {{- if $i }},{{ end }}
    {
      "@type": "Question",
      "name": {{ replace $faq.q "{email}" $email | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ replace $faq.a "{email}" $email | jsonify }}
      }
    }
    {{- end }}
  ]
}
</script>
{{- end -}}
