<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "nl" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }} | Zweefvliegen bij Arnhem{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="{{ "/images/logo.svg" | relURL }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ "/images/logo.svg" | absURL }}">
  <meta name="theme-color" content="#056BB3">

  <!-- OpenGraph -->
  <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "/images/banner1.jpg" | absURL }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:locale" content="nl_NL">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="{{ "/images/banner1.jpg" | absURL }}">

  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">

  {{ if .Params.has_map }}{{ partial "mapbox-head.html" . }}{{ end }}
  {{ if .Params.has_flights }}<script src="{{ "js/vliegdagen.js" | relURL }}" defer></script>{{ end }}
  {{ if .Params.has_startlijst }}<script src="{{ "js/startlijst.js" | relURL }}" defer></script>{{ end }}

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": ["SportsOrganization", "LocalBusiness"],
    "name": {{ .Site.Title | jsonify }},
    "description": {{ .Site.Params.description | jsonify }},
    "url": {{ .Site.BaseURL | jsonify }},
    "telephone": {{ .Site.Params.veldtelefoonnummer | jsonify }},
    "email": {{ .Site.Params.email | jsonify }},
    "sport": "Zweefvliegen",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Apeldoornseweg 203",
      "addressLocality": "Arnhem",
      "postalCode": "6816 SM",
      "addressCountry": "NL"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 52.0611,
      "longitude": 5.9376
    },
    "sameAs": [
      {{ .Site.Params.facebook | jsonify }},
      {{ .Site.Params.instagram | jsonify }},
      {{ .Site.Params.youtube | jsonify }},
      {{ .Site.Params.tiktok | jsonify }}
    ]
  }
  </script>
  {{ partial "structured-data.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.getElementById('main-nav');
    if (toggle && nav) {
      toggle.addEventListener('click', function() {
        const expanded = this.getAttribute('aria-expanded') === 'true';
        this.setAttribute('aria-expanded', String(!expanded));
        nav.classList.toggle('open');
        document.body.classList.toggle('nav-open');
      });
    }
  </script>
</body>
</html>
