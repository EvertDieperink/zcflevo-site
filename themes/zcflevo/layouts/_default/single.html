{{ define "main" }}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": {{ .Site.BaseURL | jsonify }} }
    {{ if and .Parent (not .Parent.IsHome) }},
    { "@type": "ListItem", "position": 2, "name": {{ .Parent.Title | jsonify }}, "item": {{ .Parent.Permalink | jsonify }} },
    { "@type": "ListItem", "position": 3, "name": {{ .Title | jsonify }} }
    {{ else }},
    { "@type": "ListItem", "position": 2, "name": {{ .Title | jsonify }} }
    {{ end }}
  ]
}
</script>

<div class="page-header">
  <div class="container">
    {{ if and .Parent (not .Parent.IsHome) }}
    <div class="breadcrumb">
      <a href="{{ .Site.Home.RelPermalink }}">Home</a>
      <span aria-hidden="true"> › </span>
      <a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a>
      <span aria-hidden="true"> › </span>
    </div>
    {{ else }}
    <div class="breadcrumb">
      <a href="{{ .Site.Home.RelPermalink }}">Home</a>
      <span aria-hidden="true"> › </span>
    </div>
    {{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="page-description">{{ . }}</p>{{ end }}
  </div>
</div>

<div class="page-content">
  <div class="container">
    {{ .Content }}
  </div>
</div>

{{ end }}
