{{ $accessToken := .Get "token" }}
{{ $lng := .Get "lng" }}
{{ $lat := .Get "lat" }}
{{ $zoom := .Get "zoom" | default "14" }}

<div id="mapbox-container" style="width: 100%; height: 400px; border-radius: 8px; overflow: hidden;"></div>

<script>
  function initMapbox() {
    if (typeof mapboxgl === 'undefined') {
      setTimeout(initMapbox, 100);
      return;
    }

    mapboxgl.accessToken = '{{ $accessToken }}';
    const map = new mapboxgl.Map({
      container: 'mapbox-container',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [{{ $lng }}, {{ $lat }}],
      zoom: {{ $zoom }}
    });

    new mapboxgl.Marker()
      .setLngLat([{{ $lng }}, {{ $lat }}])
      .addTo(map);
  }

  initMapbox();
</script>
