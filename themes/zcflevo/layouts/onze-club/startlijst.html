{{ define "main" }}

<div class="page-header">
  <div class="container">
    <div class="breadcrumb">
      <a href="{{ "/" | relURL }}">Home</a>
      <span aria-hidden="true"> › </span>
      <a href="{{ "/onze-club/" | relURL }}">Onze Club</a>
      <span aria-hidden="true"> › </span>
    </div>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="page-description">{{ . }}</p>{{ end }}
  </div>
</div>

<div class="flights-page">
  <div class="flights-container">

    {{ with .Content }}
    <div class="flights-intro">
      {{ . }}
    </div>
    {{ end }}

    <!-- Date picker -->
    <div class="date-picker-bar">
      <label for="flight-date">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Datum
      </label>
      <input type="date" id="flight-date" />
      <button id="prev-day" class="day-nav" aria-label="Vorige dag">&#8592;</button>
      <button id="next-day" class="day-nav" aria-label="Volgende dag">&#8594;</button>
      <span id="live-badge" class="live-badge" hidden>
        <span class="live-dot"></span> Live
      </span>
    </div>

    <!-- Dynamic content rendered by startlijst.js -->
    <div id="flights-app">
      <div class="flights-loading">
        <div class="spinner"></div>
        <span>Startlijst ophalen&hellip;</span>
      </div>
    </div>

    <p class="flights-source">
      Gegevens via <a href="https://dsa-startplank.firebaseapp.com/actief" target="_blank" rel="noopener">DSA Startplank</a>.
      Vluchten worden bijgehouden door de startleider op het veld.
    </p>

  </div>
</div>

{{ end }}
