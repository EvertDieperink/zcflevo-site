# Build de Hugo site en publiceer naar de gh-pages branch.
# GitHub Pages serveert vervolgens vanuit die branch.
name: Deploy Hugo site to GitHub Pages

on:
  # Trigger op elke push naar main.
  push:
    branches: ["main"]

  # Handmatig draaien vanuit de Actions-tab.
  workflow_dispatch:

# We hebben write-toegang nodig om de gh-pages branch te kunnen
# updaten met de gebouwde site.
permissions:
  contents: write

# Voorkom dat meerdere deploys gelijktijdig over elkaar heen lopen,
# maar laat een lopende deploy wel afronden.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
      # De URL waar de site wordt geserveerd. Bij overstap naar een
      # custom domain (zoals https://www.zcflevo.nl/) hier aanpassen.
      BASE_URL: https://evertdieperink.github.io/zcflevo-site/
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # fetch-depth 0 is nodig zodat peaceiris/actions-gh-pages
          # de hele history kan zien voor een schone gh-pages history.
          fetch-depth: 0

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          HUGO_PARAMS_MAPBOXTOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          hugo \
            --minify \
            --baseURL "${{ env.BASE_URL }}"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # Lege commits worden niet gemaakt als er niets is veranderd.
          allow_empty_commit: false
          # Zorg dat oude assets verdwijnen na rename/delete.
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: ${{ github.event.head_commit.message }}
